name: Leaderboard snapshot

# Every 3 hours: Pump.fun's PnL leaderboard (24h / 7d / 30d) and Kolscan's daily board.
# Records how much profit each rank needs and which wallets keep coming back.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: gemtracker-board
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Take leaderboard snapshot
        env:
          MY_WALLET: ${{ vars.MY_WALLET }}
        run: python -m gemtracker board
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leaderboards docs/data/leaderboard.json docs/data/leaderboard.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "data: leaderboard snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
