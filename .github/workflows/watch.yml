name: Gem hunter watch

# Every 15 minutes: did any tracked wallet buy something? Sends Telegram / Discord
# alerts and updates the dashboard's live feed. GitHub may delay scheduled runs;
# for second-by-second alerts run `python -m gemtracker watch --loop` on a PC/VPS.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: gemtracker-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Last-seen transaction per wallet is kept in the Actions cache, not in git.
      - name: Restore watch state
        uses: actions/cache@v4
        with:
          path: |
            data/watch_state.json
            .cache
          key: gemtracker-watch-${{ github.run_id }}
          restore-keys: gemtracker-watch-

      - name: Check tracked wallets
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m gemtracker watch

      - name: Commit new trades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/activity.json docs/data/activity.js 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new trades"
            exit 0
          fi
          git commit -m "data: tracked wallet trades $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
